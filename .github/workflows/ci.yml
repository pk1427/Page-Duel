name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: game-core tests
        run: pnpm --filter @book-people/game-core test

      - name: book-data tests
        run: pnpm --filter @book-people/book-data test

      - name: game tests
        run: pnpm --filter game test

      - name: admin tests
        run: pnpm --filter admin test

      - name: TypeScript checks
        run: pnpm -r run typecheck

      - name: Whitespace checks
        run: git diff --check